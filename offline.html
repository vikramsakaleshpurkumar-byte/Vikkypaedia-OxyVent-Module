          "paragraphs": [
            "Tachypnoea, recession, nasal flaring and grunting show increased work. An alert child with good air entry may still be maintaining gas exchange, but distress can progress. Respiratory rate must be interpreted with age, temperature, pain and the child’s baseline.",
            "Do not reduce severity to one sign. Assess whether effort is effective: is air actually moving, can the child interact or feed, and is circulation maintained? Repeat the assessment after intervention and record the direction of change."

          "points": [],
          "depth": "must",

            "aha-als"
          ]

        {

          "title": "Less noise is not necessarily improvement",
          "paragraphs": [
            "A previously distressed child who becomes quiet, weak, drowsy or apnoeic may be exhausting. Poor air entry, reduced respiratory effort and bradycardia are dangerous findings. Normal saturation on oxygen cannot rule out this trajectory.",
            "Call skilled help and support airway and breathing as indicated. Prepare for escalation rather than waiting for a blood gas to prove the child is failing. A rapidly changing examination deserves more attention than an earlier reassuring observation."
          ],
          "points": [],
          "depth": "must",
          "sourceIds": [
            "aha-bls",
            "aha-als"
          ]
        },
        {
          "id": "recognise-pattern",
          "title": "Locate the pattern without overclaiming",
          "paragraphs": [
            "Stridor suggests upper-airway narrowing; wheeze often points to lower-airway obstruction. Crackles with hypoxaemia can suggest lung parenchymal disease. These are localization clues, not complete diagnoses. More than one problem may coexist.",
            "A nearly silent chest in severe asthma may mean very little air movement, not resolved bronchospasm. Grunting can be an attempt to preserve end-expiratory lung volume. Interpret these signs in the whole-child picture and do not let localization delay stabilization."
          ],
          "points": [],
          "depth": "must",
          "sourceIds": [
            "aha-als"
          ]
        },
        {
          "id": "recognise-trend",
          "title": "Worked example: falling rate, rising danger",
          "paragraphs": [
            "A 4-year-old with severe wheeze is initially alert, RR 48/min with marked recession. Later the rate is 24/min, the child is drowsy, speech is weaker and air entry has fallen. There is no evidence that treatment has restored comfortable effective breathing.",
            "The falling rate accompanies loss of compensation. Urgently reassess and support breathing, call experienced help and prepare escalation. Handover the paired observations so “RR improved” is not mistaken for recovery."
          ],
          "points": [
            "Contrast recovery: easier breathing, better interaction and air entry, stable circulation and less support."
          ],
          "depth": "must",
          "sourceIds": [
            "aha-bls",
            "aha-als",
            "course"
          ]
        },

          "title": "The problem may be mixed",
          "paragraphs": [
            "Hypoxaemia, hypercapnia and circulatory failure can coexist. Keep more than one mechanism in mind when a response is incomplete. A child can need oxygen, ventilation support and treatment of poor perfusion at the same time."

      "sections": [
        {
          "id": "physiology-two",
          "title": "Two different respiratory jobs",
          "paragraphs": [
            "Oxygenation transfers oxygen into blood; ventilation clears carbon dioxide. Alveolar ventilation depends on useful gas reaching gas-exchanging lung, not simply the number of breaths. Rapid shallow breaths can waste much of the movement in dead space.",
            "Supplemental oxygen may maintain SpO₂ despite reduced ventilation. If breathing is shallow or consciousness worsens, ask about CO₂ clearance and effective respiratory effort. A normal saturation cannot answer that question."
          ],
          "points": [],
          "depth": "must",
          "sourceIds": [
            "aha-als",
            "palicc"
          ]
        },
        {
          "id": "physiology-delivery",
          "title": "Saturation is a proportion, not a quantity",
          "paragraphs": [
            "Haemoglobin carries most oxygen in blood. Saturation describes how much of that available carrier is occupied. A severely anaemic child can have a high saturation but too little total oxygen-carrying capacity.",
            "Tissue delivery also depends on cardiac output. A well-saturated blood sample does not guarantee adequate blood flow to organs. Assess perfusion and haemoglobin when the clinical picture suggests poor delivery, rather than treating saturation as the entire oxygen pathway."
          ],
          "points": [],
          "depth": "must",
          "sourceIds": [
            "aha-als",
            "palicc"
          ]
        },
        {
          "id": "physiology-mechanism",
          "title": "Why the same oxygen may have different effects",
          "paragraphs": [
            "Low inspired oxygen, hypoventilation, ventilation/perfusion mismatch and shunt can produce hypoxaemia through different routes. With a substantial shunt, some blood does not contact ventilated alveoli; increasing inspired oxygen may have limited effect on that component.",
            "V/Q mismatch means ventilation and perfusion are unevenly matched across regions. The bedside task is not to name a mechanism in isolation: use response, examination and available investigations to decide what support and cause-directed treatment are needed."
          ],
          "points": [],
          "depth": "must",
          "sourceIds": [
            "palicc",
            "aha-als"

          "points": [],
          "depth": "must",

          "title": "Use the curve as a warning about reserve",
          "paragraphs": [
            "The oxyhaemoglobin dissociation curve is flatter at high oxygen tensions and steepens at lower tensions. Once the child reaches the steep region, a small reduction in oxygen tension may produce a faster fall in saturation.",
            "This is a conceptual reason to watch trends and reserve. The curve is not a conversion calculator for an unreliable SpO₂ signal, and its position changes with physiological conditions."
          ],
          "points": [],
          "depth": "must",
          "sourceIds": [
            "palicc"

            "Do not transplant those thresholds to resuscitation, shock or PARDS. An apnoeic or exhausted child needs airway and breathing support; a cutoff calculation must not delay it."

            "Venturi adapters create a specified mixture through air entrainment. Keep ports clear and use the printed flow. A higher flow through ordinary prongs does not create a heated, humidified HFNC system."

            "Minimum mask flow is device-specific: RCH describes 4 L/min for its masks; other masks may specify 5 L/min or more. Check the actual manufacturer instructions.",

      "id": "bmv",
      "title": "Make bag-mask breaths effective",
      "subtitle": "Recognize effective ventilation, correct common failures and prepare for observed skills practice.",
      "minutes": 20,
      "phase": "Foundations",
      "visual": "bmv",
      "outcomes": [
        "Describe an effective airway position, mask seal and breath.",
        "Distinguish ventilation with a pulse from the CPR context.",
        "Troubleshoot absent chest rise and recognize harmful overventilation."
      ],
      "roleNotes": {
        "ug": "Talk through the sequence on a manikin and ask an assessor to observe your actual technique.",
        "nurse": "Prepare the correct equipment, call for help and assist ventilation within your training; report chest rise and physiological response.",
        "picu": "Coordinate two-person ventilation, monitor chest movement and haemodynamics, and identify increased resistance or a failing seal.",
        "pg": "Lead airway and ventilation assessment, allocate roles and choose a rescue plan when basic corrections do not restore effective breaths."
      },
      "sections": [
        {
          "id": "bmv-prepare",
          "title": "Start with airway, equipment and help",
          "paragraphs": [
            "Bag-mask ventilation is a physical skill. Before practice, identify the child’s breathing and circulation status, call for help and use age-appropriate equipment. Open the airway, choose a mask that covers nose and mouth without pressing on the eyes, and establish a seal.",
            "For infants, avoid excessive neck extension; position the airway appropriately for age and clinical circumstances. In suspected trauma, use the trained approach to airway opening and spinal precautions. An online sequence is preparation for supervised demonstration, not permission for independent performance."
          ],
          "points": [],
          "depth": "must",
          "sourceIds": [
            "aha-bls",
            "aha-als"
          ]
        },
        {
          "id": "bmv-breath",
          "title": "Give only the breath that is needed",
          "paragraphs": [
            "Deliver a breath sufficient for visible chest rise, then allow exhalation. Watch the child rather than the size of the bag squeeze. A leaking mask may give poor chest movement despite large squeezes; excessive pressure can inflate the stomach and injure the lung.",
            "A two-person technique allows one rescuer to use both hands for airway opening and seal while another squeezes the bag. Reassess chest movement and physiological response after a correction. Better chest rise and an improving heart rate support effectiveness."
          ],
          "points": [],
          "depth": "must",
          "sourceIds": [
            "aha-bls",
            "aha-als"
          ]
        },
        {
          "id": "bmv-rate",
          "title": "The resuscitation context changes the sequence",
          "paragraphs": [
            "In the 2025 AHA/AAP example, an infant or child with a pulse but absent/inadequate breathing can receive one breath every 2–3 seconds, approximately 20–30/min. This is not the newborn delivery-room pathway.",
            "Cardiac arrest requires the applicable pediatric CPR sequence, including compressions and the appropriate ventilation coordination for airway status and number of rescuers. Do not apply a breathing-with-a-pulse plan to an arrested child. Assess circulation and follow your current training/local resuscitation pathway."
          ],
          "points": [],
          "depth": "must",
          "sourceIds": [
            "aha-bls"
          ]
        },
        {
          "id": "bmv-trouble",
          "title": "Worked example: no chest rise",
          "paragraphs": [
            "On a manikin, a learner squeezes the bag but the chest does not rise. First correct airway position and mask seal; inspect for obstruction and suction when indicated. Ask a second trained rescuer to help. Simply squeezing harder or faster may worsen gastric inflation without ventilating the lungs.",
            "If corrections fail, reassess the airway, equipment and possible obstruction, and escalate to skilled airway support. State what you tried and whether the bag felt unusually resistant. Do not repeat an ineffective maneuver indefinitely."
          ],
          "points": [],
          "depth": "must",
          "sourceIds": [
            "aha-bls",
            "aha-als",
            "course"
          ]
        },
        {
          "id": "bmv-harm",
          "title": "Avoid overventilation and verify the response",
          "paragraphs": [
            "Excessive rate can shorten exhalation and cause air trapping, especially with obstructive disease. Excessive pressure and volume can increase intrathoracic pressure, impair venous return and injure lungs. Effective ventilation is adequate support with reassessment, not the fastest possible bagging.",
            "During supervised practice, the assessor should watch position, seal, chest rise, rate/context, troubleshooting and team communication. Use the toolkit checklist to structure feedback, but do not treat checking boxes online as an observed procedure."
          ],
          "points": [],
          "depth": "must",
          "sourceIds": [
            "aha-bls",
            "aha-als"
          ]
        },
        {
          "id": "bmv-depth",
          "title": "Discuss what resistance tells you",
          "paragraphs": [
            "A difficult-to-squeeze bag can reflect an airway or lung problem; an unusually easy bag may reflect a leak or disconnection. These sensations are clues, not diagnoses. Use them with chest movement, air entry and the full clinical assessment."
          ],
          "points": [],
          "depth": "good",
          "sourceIds": [
            "aha-als"
          ]
        },
        {
          "id": "bmv-enrich",
          "title": "Rehearse team communication",
          "paragraphs": [
            "Practice announcing: “No chest rise; repositioning and checking the seal.” The second rescuer acknowledges, performs the assigned action and reports the result. Use closed-loop communication to make the troubleshooting visible to the team."
          ],
          "points": [],
          "depth": "nice",
          "sourceIds": [
            "course"
          ]
        }

      "sections": [
        {
          "id": "hfnc-system",
          "title": "HFNC is a system, not a higher wall flow",
          "paragraphs": [
            "HFNC delivers heated, humidified high flow through a designed circuit and cannula. Use the specified components, humidifier and interface; ordinary prongs connected to higher wall flow are not equivalent. Cannulae should allow a leak around the nares according to the device guidance.",
            "Flow helps meet inspiratory demand and supports washout/work of breathing. FiO₂ is adjusted to the oxygenation goal. Neither the flow display nor a comfortable interface proves that ventilation is adequate."
          ],
          "points": [],
          "depth": "must",
          "sourceIds": [
            "rch-hfnc"
          ]
        },
        {
          "id": "hfnc-select",
          "title": "Select a child and a place that can support a trial",
          "paragraphs": [
            "Before starting, agree the indication, target, responsible clinician, observations and failure plan. Consider the child’s effort, airway protection, apnoea, circulation and available rescue support. A failing or unstable child needs urgent senior review, not an unmonitored trial designed to postpone definitive support.",
            "In an Indian district or referral setting, ask whether trained observation, reliable power/gas, rapid review and transfer are available. Treatment suitability includes the ability to detect and respond to failure."
          ],
          "points": [],
          "depth": "must",
          "sourceIds": [
            "rch-hfnc",
            "aha-als"
          ]
        },
        {
          "id": "hfnc-start",
          "title": "A named protocol example, with limits",
          "paragraphs": [
            "RCH’s published HFNP pathway uses 2 L/kg/min for children up to 12 kg. Above 12 kg, its example adds 0.5 L/kg/min for each additional kilogram, up to 50 L/min. These are RCH-specific teaching examples, not a universal prescription. A 6 kg child would therefore receive a flow of 12 L/min under that example.",
            "Use the actual local prescription, device limits and appropriate oxygen titration. Record the starting state so you can compare response. Reassess early and repeatedly; worsening effort, apnoea, consciousness or circulation require immediate escalation. Do not wait for the end of a routine observation window."
          ],
          "points": [],
          "depth": "must",
          "sourceIds": [
            "rch-hfnc"
          ]
        },
        {
          "id": "hfnc-response",
          "title": "Worked example: decide from the trajectory",
          "paragraphs": [
            "A 6 kg infant with bronchiolitis begins a supervised HFNC trial. In the successful trajectory, effort and heart rate fall, interaction improves and the oxygen requirement decreases. Continue the agreed monitoring and plan gradual withdrawal according to the adopted pathway.",
            "In the failing trajectory, drowsiness, recurrent apnoea or worsening gas exchange develop. Check the child and system, call skilled help and prepare escalation. A good saturation on a high FiO₂ does not rescue a failing ventilation trial."
          ],
          "points": [],
          "depth": "must",
          "sourceIds": [
            "rch-hfnc",
            "aha-als",
            "course"
          ]
        },
        {
          "id": "hfnc-care",
          "title": "Care, weaning and transport belong in the plan",
          "paragraphs": [
            "Check skin/nares, circuit position, humidification, secretions and abdominal distension. Feeding depends on respiratory stability and the adopted pathway; do not assume that a nasal interface makes oral feeding safe during deterioration.",
            "Wean when clinical improvement is sustained, not because a bed is needed. Published pathways differ in flow reduction versus cessation, so name the protocol you are following. Confirm that power, gas and adequate support can continue in transit; an unstable child who cannot tolerate the transport setup needs escalation of transport support."
          ],
          "points": [],
          "depth": "must",
          "sourceIds": [
            "rch-hfnc"
          ]
        },
        {
          "id": "hfnc-depth",
          "title": "A trend is more useful than a ritual",
          "paragraphs": [
            "A single post-start number is less informative than the change in effort, heart rate, respiratory rate, oxygen need and interaction. Ask which element is failing to improve and whether a different mechanism or a failing support strategy explains it."

          "points": [],
          "depth": "good",
          "sourceIds": [
            "rch-hfnc"
          ]

      "subtitle": "Match the support mechanism to the child, then watch fit, synchrony and physiological response.",

        "Identify suitability, failure signs and interface problems.",
        "Use a reassessment plan that avoids delayed definitive support."
      ],
      "roleNotes": {

        "nurse": "Monitor comfort, skin, leaks, secretions and response; escalate altered consciousness, vomiting/poor reflexes or instability.",
        "picu": "Relate interface leak and timing to effective delivery; report physiological changes before adjusting settings under the agreed plan.",
        "pg": "Select a suitable patient, prescribe a bounded trial and decide when physiology requires a different support strategy."
      },
      "sections": [
        {
          "id": "niv-mechanism",
          "title": "CPAP and bilevel do different jobs",
          "paragraphs": [
            "CPAP provides a continuous distending pressure throughout the respiratory cycle. Bilevel support adds a higher inspiratory pressure above expiratory pressure; the difference assists inspiration. A mode name alone does not tell you how much effective support reaches the child.",
            "Consider the physiological problem, the interface and the child’s own respiratory effort. Gas exchange can remain poor despite apparently correct settings if delivery is compromised by leak, obstruction or asynchrony."
          ],
          "points": [],
          "depth": "must",
          "sourceIds": [
            "aha-als",
            "palicc"
          ]
        },
        {
          "id": "niv-select",
          "title": "A suitable child must also be safely monitored",
          "paragraphs": [
            "Airway protection, manageable secretions, haemodynamic stability and a tolerable interface are central to a safe trial. A child who cannot protect the airway or needs immediate intubation must not be kept on NIV simply to avoid escalation.",
            "Agree who is reviewing, what improvement is expected and what findings will trigger a stop/change in strategy. Vomiting with weak airway reflexes raises aspiration concern. Clinical deterioration overrides the trial’s planned duration."
          ],
          "points": [],
          "depth": "must",
          "sourceIds": [
            "aha-als",
            "palicc"
          ]
        },
        {
          "id": "niv-delivery",
          "title": "Check leak, fit and timing",
          "paragraphs": [
            "An unintentional leak may reduce effective pressure and interfere with triggering. Check interface size/position, circuit connections and the system’s intended leak/exhalation design. Do not block a designed exhalation port or overtighten straps to eliminate every leak.",
            "Synchrony means the timing and delivery of support match the child’s breathing demand. Watch effort, chest movement, comfort and the device together. A distressed child needs assessment before assuming that more pressure or more sedation is the answer."
          ],
          "points": [],
          "depth": "must",
          "sourceIds": [
            "aha-als",
            "palicc"
          ]
        },
        {
          "id": "niv-response",
          "title": "Worked example: useful trial or dangerous persistence?",
          "paragraphs": [
            "A child begins NIV with an agreed review plan. Effort decreases, interaction improves and gas exchange trends favorably: maintain observation and reassess the need for support. Mild early anxiety or a correctable leak can be troubleshot while monitoring the child.",
            "A second child becomes hypotensive, obtunded and more acidotic. These are physiological failure signs, not merely a mask-tolerance problem. Call experienced help, reassess airway and circulation and prepare definitive support. Do not keep increasing settings indefinitely."
          ],
          "points": [],
          "depth": "must",
          "sourceIds": [
            "aha-als",
            "palicc",
            "course"
          ]
        },
        {
          "id": "niv-care",
          "title": "Protect skin and plan ongoing care",
          "paragraphs": [
            "Inspect pressure points and fit, manage secretions, assess abdominal distension and make an explicit nutrition/hydration plan. The interface can impair communication, so agree how the child can signal discomfort when appropriate.",
            "Weaning readiness depends on sustained clinical improvement and the adopted pathway. During handover include the settings, measured response, leak/synchrony concerns and exact failure plan. In a resource-constrained setting, rapid skilled review is part of the treatment requirement."
          ],

        "Describe airway confirmation, depth checks and reassessment.",
        "Plan post-intubation care and a supported handover."
      ],
      "roleNotes": {
        "ug": "Name the physiological risks and explain how the team prepares; drug prescribing is outside this course.",
        "nurse": "Prepare checked equipment, monitoring and suction, confirm team roles and assist drug double-checks under local policy.",
        "picu": "Anticipate peri-intubation instability, confirm monitoring and circuit readiness, and track fixation/depth after movement.",
        "pg": "Lead a primary/rescue strategy, optimize physiology with senior help, assign stop points and plan post-intubation support."
      },
      "sections": [
        {
          "id": "airway-prepare",
          "title": "Prepare people and physiology",
          "paragraphs": [
            "An apparently straightforward laryngoscopy can still be dangerous in a severely hypoxaemic, shocked or acidotic child. Call experienced help early; review oxygenation, perfusion and the consequences of interrupting breathing. The safest preparation addresses both anatomy and physiology.",
            "Assign an airway operator, assistant, medication/monitoring roles and a clear leader. Check suction, oxygen, ventilation equipment, tube/fixation supplies, primary and rescue devices, and whether the team can use them. An equipment list without an executable rescue plan is incomplete."
          ],
          "points": [],
          "depth": "must",
          "sourceIds": [
            "aha-als"
          ]
        },
        {
          "id": "airway-plan",
          "title": "Make the primary and rescue plans explicit",
          "paragraphs": [
            "State the intended first approach, alternatives, limits on repeated attempts and when to pause, reoxygenate and change the plan. Preoxygenation builds oxygen reserve; it does not make an unlimited period without effective ventilation safe.",
            "Before medication, use the best available verified weight and the local prescribing/double-check process. This module does not provide induction drug doses. A learner should recognize the need for checking and appropriate supervision rather than infer dosing authority from an online result."
          ],
          "points": [],
          "depth": "must",
          "sourceIds": [
            "aha-als"
          ]
        },
        {
          "id": "airway-confirm",
          "title": "Confirm tracheal placement and evaluate depth",
          "paragraphs": [
            "Use sustained exhaled CO₂ detection/waveform capnography with clinical assessment when available. Examine chest movement and air entry, assess oxygenation, record tube depth and secure fixation. Tube misting or colour improvement alone is insufficient confirmation.",
            "Markedly reduced pulmonary blood flow or cardiac arrest can make exhaled CO₂ detection unreliable. An absent signal requires urgent evaluation; do not assume a single explanation. A positive CO₂ signal also does not prove the tube is at the correct depth: a mainstem tube can still produce CO₂."
          ],
          "points": [],
          "depth": "must",
          "sourceIds": [
            "aha-als"
          ]
        },
        {
          "id": "airway-after",
          "title": "The procedure continues after tube placement",
          "paragraphs": [
            "Prepare ventilator connection, continued oxygenation/ventilation monitoring, appropriate sedation/analgesia under the clinical plan and haemodynamic support. Check delivered values and alarms rather than only the set mode.",
            "After moving the child, reassess fixation, depth, chest movement, bilateral air entry and gas exchange. A new asymmetry or deterioration calls for immediate patient–tube–circuit assessment. Do not assume that the earlier confirmation remains sufficient after transport or repositioning."
          ],
          "points": [],
          "depth": "must",
          "sourceIds": [
            "aha-als",
            "palicc"
          ]
        },
        {
          "id": "airway-case",
          "title": "Worked example: a technically easy, physiologically risky airway",
          "paragraphs": [
            "A child with severe pneumonia is exhausted and poorly perfused. The team predicts an easy view but recognizes high risk of desaturation and hypotension during the transition to invasive support. They organize experienced help, physiological stabilization, suction, monitoring and a backup ventilation plan before attempting intubation.",
            "After successful placement, the team checks CO₂ and bilateral air entry, secures and records depth, then reassesses circulation and delivered ventilation. The question is not just “is the tube in?” but “is the child safely supported now?”"
          ],
          "points": [],
          "depth": "must",
          "sourceIds": [
            "aha-als",
            "course"
          ]
        },
        {
          "id": "airway-depth",
          "title": "A useful stop point",
          "paragraphs": [
            "Repeated attempts without re-optimization can worsen hypoxaemia and airway trauma. A shared stop point prompts the team to pause, oxygenate, call expertise and change the approach rather than repeat the same failure."
          ],
          "points": [],
          "depth": "good",
          "sourceIds": [
            "aha-als"
          ]
        },
        {
          "id": "airway-enrich",
          "title": "Rehearse the first minute after intubation",
          "paragraphs": [
            "On a manikin, ask each team member to state what they check after placement and after movement. Identify who responds to hypotension, missing CO₂ or an unexpected pressure alarm."
          ],
          "points": [],
          "depth": "nice",
          "sourceIds": [
            "course"
          ]
        }
      ],

      "sections": [

          "id": "ventilation-controls",
          "title": "Separate the goals of the controls",
          "paragraphs": [
            "FiO₂ and airway-pressure/recruitment strategy influence oxygenation. Effective alveolar ventilation influences CO₂ clearance. Minute ventilation is tidal volume multiplied by respiratory rate, but useful ventilation also depends on dead space and the volume actually delivered.",
            "Example: 120 mL × 20 breaths/min is 2.4 L/min. The same displayed minute ventilation can be less effective when dead space is larger or leaks are substantial. Increasing rate without allowing adequate expiration can worsen air trapping in obstruction."
          ],
          "points": [],
          "depth": "must",
          "sourceIds": [
            "palicc",
            "course"
          ]
        },
        {
          "id": "ventilation-delivered",
          "title": "Inspect what reaches the patient",
          "paragraphs": [
            "After connection, assess the child, tube, circuit, exhaled tidal volume, pressures, gas exchange, circulation and alarms. A set tidal volume does not prove the delivered volume matches it, especially with leak and circuit effects.",
            "Look at trends and the clinical response after every change. Pressure-targeted and volume-targeted strategies allow different variables to vary; understand the chosen mode’s behavior and limits. Alarm settings must match the patient and intended support, not be silenced by default."
          ],
          "points": [],
          "depth": "must",
          "sourceIds": [
            "palicc",
            "aha-als"
          ]
        },
        {
          "id": "ventilation-mechanics",
          "title": "Resistance, compliance and time",
          "paragraphs": [
            "Peak pressure includes resistive and elastic components. With appropriate static measurement conditions, a higher peak pressure while plateau pressure is unchanged suggests increased resistance. If plateau also rises, consider reduced respiratory-system compliance among the causes. Coughing, effort and measurement conditions can confound this interpretation.",
            "An expiratory flow curve that does not return to zero before the next breath suggests incomplete exhalation. In obstructive disease, this raises concern for dynamic hyperinflation/auto-PEEP. Assess the child, timing and cause; simply increasing rate may make it worse."
          ],
          "points": [],
          "depth": "must",
          "sourceIds": [
            "palicc"
          ]
        },
        {
          "id": "ventilation-protect",
          "title": "Lung protection is a set of constraints",
          "paragraphs": [
            "For PARDS, PALICC-2 suggests physiological tidal volumes around 6–8 mL/kg, reducing below 6 when needed to respect pressure limits, with caution below 4. Its general plateau-pressure suggestion is at most 28 cm H₂O, with specified chest-wall exceptions; driving pressure is suggested at most 15 cm H₂O under static conditions. These are qualified recommendations, not a universal initial prescription.",
            "Use the lesser of predicted or actual body weight for the guideline’s size-normalized measures. Titrate PEEP with oxygenation, delivery, haemodynamics and compliance together. A larger volume just to normalize a gas may worsen injury."
          ],
          "points": [],
          "depth": "must",
          "sourceIds": [
            "palicc"
          ]
        },
        {
          "id": "ventilation-gas",
          "title": "Worked example: accept a bounded trade-off",
          "paragraphs": [
            "A fictional PARDS case has high pressures while the team tries to normalize PaCO₂. PALICC-2 permits selected permissive hypercapnia to a lower pH limit of 7.20 to remain within protective pressure/volume constraints. This does not mean ignoring severe acidosis or circulation.",
            "Important exceptions include intracranial hypertension, severe pulmonary hypertension, selected congenital heart lesions, haemodynamic instability and significant ventricular dysfunction. Review the whole patient and the full guideline/local plan. Contrast obstruction: there, allowing time for exhalation may be central to avoiding air trapping."
          ],
          "points": [],
          "depth": "must",
          "sourceIds": [
            "palicc",
            "course"
          ]
        },
        {
          "id": "ventilation-depth",
          "title": "Oxygen exposure also needs a goal",
          "paragraphs": [
            "PALICC-2 suggests SpO₂ 92–97% in mild/moderate PARDS, with qualified lower saturation acceptance in severe disease after PEEP optimization and closer delivery monitoring. This is a disease-specific example. It should not be substituted for all pediatric or cardiac targets."
          ],
          "points": [],
          "depth": "good",
          "sourceIds": [
            "palicc"
          ]
        },

          "title": "A static measurement is a clinical condition",

function home(){const n=C.units.filter(u=>K.mastered(state,u)).length,next=nextUnit();return `<section class="hero"><div><p class="eyebrow">PEDIATRIC RESPIRATORY LEARNING</p><h1 tabindex="-1">See the child.<br>Support the breath.</h1><p>From the first concerning observation to a safe escalation plan. Learn through patients, physiology and decisions.</p><div class="actions">${button(next?`${state.active[next.id]?'Resume':'Continue with'} ${next.title}`:'Get your certificate',next?`${state.active[next.id]?'assessment':'learn'}/${next.id}`:'certificate')}${button('Check your starting point','baseline','ghost')}</div></div><div class="hero-art" aria-hidden="true"><svg viewBox="0 0 240 180"><path d="M120 20v66m0-16L92 98m28-28 28 28M104 36C65 32 40 77 39 121c0 41 55 34 65 18V36Zm32 0c39-4 64 41 65 85 0 41-55 34-65 18V36Z" fill="none" stroke="currentColor" stroke-width="5" stroke-linecap="round"/></svg><span>ASSESS · INTERVENE · REASSESS</span></div></section><div class="stats"><div><b>${n}<small> / ${C.units.length}</small></b><span>Units currently mastered</span></div><div><b>2</b><span>Clinical forms per unit</span></div><div><b>90%<small> + safety</small></b><span>Clear progression criteria</span></div></div><section class="intro-grid"><div class="card"><p class="eyebrow">YOUR ${esc(C.roles[state.role])} PATH</p><h2>Build a decision you can explain.</h2><p>Worked examples, core teaching and ten decisions per unit. Change your role to see its responsibilities; deeper layers add context without hiding assessed essentials.</p><p class="small">About ${C.units.reduce((n,u)=>n+u.minutes,0)} minutes, plus retries. Estimates await learner-pilot validation.</p></div><div class="card soft"><h2>How progression works</h2><p>Reach 9/10 with no safety-critical errors. A finished retry updates current readiness; your first attempt remains in My record. Explain-back checks track study completion separately.</p><a href="#about">Read the learning rules →</a></div></section><div class="section-heading"><p class="eyebrow">THE COMPLETE PATHWAY</p><h2>One connected clinical story.</h2></div><div class="course-map">${C.units.map((u,i)=>`<article class="course-row"><span class="map-number">${String(i+1).padStart(2,'0')}</span><div><span class="tag">${status(u)}</span><h3>${esc(u.title)}</h3><p>${esc(u.subtitle)}</p><small>${u.minutes} min · ${u.questions.length} decisions · ${esc(u.phase)}</small></div>${button(K.unlocked(state,C,u)?'Open unit →':'View prerequisite',`learn/${u.id}`,'secondary')}</article>`).join('')}</div>`;}
function locked(u){const p=C.units.find(x=>!K.mastered(state,x));return heading('A prerequisite comes first',u.title,'Earlier units must meet the score and safety standard.')+`<div class="card"><h2>Continue with ${esc(p.title)}</h2><p>A failed completed reassessment marks current readiness for review. Earlier achievements remain in My record.</p>${button('Open prerequisite',`learn/${p.id}`)} ${button('Course map','home','secondary')}</div>`;}
function notFound(){return heading('Course navigation','This page is not available')+button('Return to your course map','home');}
function lesson(u,anchor){const shown=u.sections.filter(s=>rank[s.depth]<=rank[state.depth]||s.id===anchor);return heading(`UNIT ${C.units.indexOf(u)+1} · ${u.phase} · ${u.minutes} MIN`,u.title,u.subtitle)+`<div class="card outcomes"><p class="eyebrow">BY THE END, YOU CAN</p><ul>${u.outcomes.map(o=>`<li>${esc(o)}</li>`).join('')}</ul></div><div class="role-card"><span class="tag">${esc(C.roles[state.role])}</span><h2>Your responsibility in this unit</h2><p>${esc(u.roleNotes[state.role])}</p></div>${visual(u.visual)}${lessonTools(u)}<nav class="lesson-index" aria-label="On this page">${shown.map(s=>`<a href="#learn/${u.id}/${s.id}">${esc(s.title)}</a>`).join('')}</nav>${shown.map((s,i)=>`<section class="lesson-card card ${anchor===s.id?'highlight':''}" id="section-${s.id}"><div class="card-kicker"><span class="tag">${{must:'Must Know',good:'Good to Know',nice:'Nice to Know'}[s.depth]}</span><span>${String(i+1).padStart(2,'0')}</span></div><h2>${esc(s.title)}</h2>${s.paragraphs.map(p=>`<p>${esc(p)}</p>`).join('')}${s.points?.length?`<ul>${s.points.map(p=>`<li>${esc(p)}</li>`).join('')}</ul>`:''}${refs(s.sourceIds)}<label class="checkline"><input type="checkbox" data-check="${s.id}" ${state.checks[s.id]?'checked':''}><span>I can explain the key decision in my own words.</span></label></section>`).join('')}${shown.length<u.sections.length?`<button class="btn secondary" data-depth-all>Show ${u.sections.length-shown.length} deeper section(s)</button>`:''}<section class="card"><h2>Pause and explain</h2><label for="reflection">${esc(u.reflection)}</label><textarea id="reflection" data-note="${u.id}" maxlength="4000" placeholder="A brief learning note—no patient-identifying details">${esc(state.notes[u.id]||'')}</textarea><p class="small" id="note-status">Stored only in this browser.</p></section><section class="assessment-cta"><p class="eyebrow">PUT THE LEARNING TO WORK</p><h2>${u.sequential?'Follow an unfolding patient':'Make ten clinical decisions'}</h2><p>Choose, rate confidence, then submit. Feedback explains your choice and points back to teaching.</p><p>${K.history(state,u).length>=2?'Both forms have been available. Further attempts repeat those forms: practice, not unseen assessment.':'Two authored clinical forms alternate between attempts. Options change position; reasoning matters.'}</p><button class="btn primary" data-start="${u.id}">${state.active[u.id]?'Resume saved assessment':K.latest(state,u)?'Start reassessment':'Start assessment'} →</button> ${K.latest(state,u)?button('Latest result',`result/${u.id}`,'ghost'):''}</section><div class="actions">${button('← Course map','home','secondary')}${C.units[C.units.indexOf(u)+1]&&K.mastered(state,u)?button('Open next unit →',`learn/${C.units[C.units.indexOf(u)+1].id}`):''}</div>`;}
function questionHtml(q,response,order,context){order||=q.options.map(o=>o.id);const p=pending[q.id]||{};return `<section class="question card" data-q="${q.id}"><div class="card-kicker"><span class="tag">${q.critical?'Safety-critical decision':'Clinical reasoning'}</span><span>${response?'Answer recorded':'Commit before feedback'}</span></div><h2>${esc(q.stem)}</h2>${response?`<p><b>Your answer:</b> ${esc(q.options.find(o=>o.id===response.choice)?.text)}</p><p><b>Best answer:</b> ${esc(q.options.find(o=>o.id===q.answer).text)}</p>`:`<fieldset><legend class="sr-only">Choose one answer</legend>${order.map((id,i)=>{const o=q.options.find(o=>o.id===id);return `<label class="option"><input type="radio" name="answer-${q.id}" value="${o.id}" ${p.choice===o.id?'checked':''}><span class="letter">${String.fromCharCode(65+i)}</span><span>${esc(o.text)}</span></label>`;}).join('')}</fieldset><div class="confidence-row"><label for="conf-${q.id}">How sure are you?<select id="conf-${q.id}" data-confidence="${q.id}"><option value="">Select confidence</option>${[[1,'Guessing'],[2,'Partly sure'],[3,'Confident']].map(([v,t])=>`<option value="${v}" ${p.confidence===v?'selected':''}>${t}</option>`).join('')}</select></label><button class="btn primary" data-submit="${q.id}" data-context="${context}">Submit decision</button></div><p class="error" id="error-${q.id}" role="alert"></p>`}${response?`<div class="feedback ${response.choice===q.answer?'correct':'incorrect'}" role="status"><strong>${response.choice===q.answer?'Correct decision':'Review this decision'}</strong><p>${esc(q.options.find(o=>o.id===response.choice)?.feedback)}</p><p>${esc(q.why)}</p></div><details><summary>Why the other choices differ</summary>${q.options.map(o=>`<p><b>${esc(o.text)}</b><br>${esc(o.feedback)}</p>`).join('')}</details>${q.sectionId?button('Review the exact teaching →',`learn/${context.split(':')[1]}/${q.sectionId}`,'text'):''}${refs(q.sourceIds)}`:''}</section>`;}
function assessment(u){const a=state.active[u.id];if(!a)return heading('Assessment',u.title,'Start from the lesson to choose a new form.')+`<button class="btn primary" data-start="${u.id}">Start assessment</button>`;const pos=a.feedback?a.responses.length-1:a.responses.length,q=u.questions.flatMap(p=>p.variants).find(q=>q.id===a.order[pos]);if(!q)return resultPage(u);return heading(`FORM ${a.form.toUpperCase()} · QUESTION ${pos+1} OF ${a.order.length}`,u.title,u.sequential?'An original fictional patient. Each decision reveals the next stage.':'Your attempt is saved as you go. Return to teaching whenever you need it.')+`<div class="quiz-progress" role="progressbar" aria-label="Questions answered" aria-valuemin="0" aria-valuemax="${a.order.length}" aria-valuenow="${a.responses.length}"><i style="width:${a.responses.length/a.order.length*100}%"></i></div>${questionHtml(q,a.feedback?a.responses[pos]:null,a.optionOrder[q.id],`unit:${u.id}`)}${a.feedback?`<button class="btn primary" data-next="${u.id}">${a.responses.length===a.order.length?'See your result':'Next decision'} →</button>`:''}<div class="actions">${button('Return to teaching',`learn/${u.id}`,'secondary')}<span class="small">${storageOK?'Progress saved on this device':'Session only · storage unavailable'}</span></div>`;}
function resultPage(u){const h=K.history(state,u),s=K.summarize(u,h.at(-1));if(!s)return heading('Learning record','No completed attempt yet')+button('Open lesson',`learn/${u.id}`);const next=C.units[C.units.indexOf(u)+1];return heading(s.passed?'CURRENT MASTERY ACHIEVED':'FOCUSED REVIEW',u.title,s.passed?'You reached the score and safety standard.':s.criticalMiss?'A safety-critical decision needs review, regardless of the overall score.':'Review missed concepts, then apply them in the alternate form.')+`<div class="result-card"><strong>${s.percent}%</strong><div>${s.correct}/${s.total} correct<br>${s.criticalMiss?'Safety-critical error recorded':'No safety-critical errors'}<br>First complete attempt: ${K.summarize(u,h[0]).percent}% · Best: ${Math.max(...h.map(a=>K.summarize(u,a).percent))}%</div></div>${s.missed.length?`<section class="card"><h2>Your focused review</h2>${s.missed.map(q=>`<div class="remediation"><h3>${esc(q.stem)}</h3><p>${esc(q.why)}</p>${button('Review this concept',`learn/${u.id}/${q.sectionId}`,'secondary')}</div>`).join('')}</section>`:''}<div class="actions">${s.passed?button(next?'Continue to next unit':'Get your certificate',next?`learn/${next.id}`:'certificate'):''}<button class="btn secondary" data-start="${u.id}">Try ${h.length>=2?'a repeated':'the alternate'} form</button>${button('Review unit',`learn/${u.id}`,'secondary')}</div>`;}
function baseline(){return heading('OPTIONAL · DOES NOT CHANGE PROGRESSION','Find your starting point','Three decisions to surface your assumptions. Initial responses stay visible; these do not count toward unit mastery.')+C.baseline.map(q=>questionHtml(q,state.baseline[q.id],null,'baseline')).join('')+button('Begin the learning pathway',`learn/${C.units[0].id}`);}
function caseLibrary(){return heading('ORIGINAL FICTIONAL PATIENTS','Practice across a changing situation','Guided journeys are separate from scored unit attempts. Correct each decision to reveal the next stage.')+`<div class="case-grid">${C.cases.map(c=>`<article class="card"><p class="eyebrow">${esc(c.setting)}</p><h2>${esc(c.title)}</h2><p>${esc(c.intro)}</p>${button('Enter patient journey',`case/${c.id}`)}</article>`).join('')}</div>`;}
function casePage(c){let i=c.steps.findIndex(q=>state.cases[q.id]?.choice!==q.answer||!state.cases[q.id]?.acknowledged);const done=i<0;if(done)i=c.steps.length-1;const q=c.steps[i],r=state.cases[q.id];return heading(`PATIENT JOURNEY · STEP ${i+1}/${c.steps.length}`,c.title,c.intro)+questionHtml(q,r,null,'case')+(r&&r.choice!==q.answer?`<button class="btn secondary" data-case-retry="${q.id}">Reconsider this decision</button>`:'')+(r&&r.choice===q.answer&&!done?`<button class="btn primary" data-case-next="${q.id}">${i===c.steps.length-1?'Read the debrief':'Reveal the next stage'} →</button>`:'')+(done?`<section class="card soft"><h2>Debrief</h2><p>${esc(c.debrief)}</p>${refs(c.sourceIds)}</section>`:'')+button('All patient journeys','cases','secondary');}
function record(){const n=C.units.filter(u=>K.mastered(state,u)).length;return heading('YOUR LOCAL LEARNING RECORD','Progress with an honest history','First attempt and current readiness answer different questions. Your completion certificate is available once all twelve units meet the score and safety standard.')+`<div class="actions">${button('Completion certificate','certificate')}<button class="btn secondary" id="exportRecord">Download learning record</button><button class="btn secondary" id="printRecord">Print record</button><button class="btn secondary" id="resetRecord">Reset this edition’s progress</button></div><div class="table-wrap"><table><caption>Assessment and study completion by unit</caption><thead><tr><th>Unit</th><th>First</th><th>Latest</th><th>Best</th><th>Current status</th></tr></thead><tbody>${C.units.map(u=>{const h=K.history(state,u),last=K.latest(state,u);return `<tr><th><a href="#learn/${u.id}">${esc(u.title)}</a></th><td>${h.length?K.summarize(u,h[0]).percent+'%':'—'}</td><td>${last?last.percent+'%':'—'}</td><td>${h.length?Math.max(...h.map(a=>K.summarize(u,a).percent))+'%':'—'}</td><td>${status(u)}${last?.criticalMiss?' · critical review':''}${state.active[u.id]?' · attempt in progress':''}${K.complete(state,u)?' · explain-back complete':''}<small>${h.length} completed attempt(s)</small></td></tr>`;}).join('')}</tbody></table></div>${reviewPlan()}<section class="card"><h2>Confidence calibration</h2>${confidenceSummary()}<p class="small">Confidence is a reflection aid, not a credential.</p></section>${n===C.units.length?`<section class="certificate"><p class="eyebrow">SELF-DIRECTED COMPLETION RECORD</p><h2>Vikkypaedia OxyVent</h2><p>All ${n} units currently meet the 90% and safety standard.</p><p>Edition ${C.version} · Last assessment: ${esc(K.history(state,C.units.at(-1)).at(-1)?.finished?.slice(0,10))}</p><p>Online knowledge and fictional-case decisions. No procedural competence, accreditation or authority to practice is conferred.</p></section>`:`<div class="card soft"><h2>${n} of ${C.units.length} units currently mastered</h2>${button('Continue learning',`learn/${nextUnit()?.id||C.units[0].id}`)}</div>`}${state.legacy?`<details><summary>Previous-edition archive</summary><p>${Number(state.legacy.completed)||0} previously completed units. These results were not converted into passes on the revised assessment.</p></details>`:''}`;}
function confidenceSummary(){const items=C.units.flatMap(u=>{const h=K.history(state,u);return h.length?h[0].responses.filter(r=>r.confidence===3&&u.questions.flatMap(p=>p.variants).find(q=>q.id===r.id)?.answer!==r.choice).map(r=>({u,q:u.questions.flatMap(p=>p.variants).find(q=>q.id===r.id)})):[];});return items.length?`<p>${items.length} confident first-attempt error(s):</p><ul>${items.map(({u,q})=>`<li><a href="#learn/${u.id}/${q.sectionId}">${esc(q.stem)}</a></li>`).join('')}</ul>`:'<p>No confident errors in completed first attempts so far. Unattempted units have not been evaluated.</p>';}
function toolkit(){return heading('TAKE THE THINKING WITH YOU','Bedside learning toolkit','Educational prompts for supervised practice. Apply approved local protocols.')+`<div class="card"><h2>Oxygen and support handover</h2><ol><li>Child, age, condition and concerning trend.</li><li>Target, source, interface, flow/FiO₂ and current support.</li><li>Response: effort, air entry, consciousness, SpO₂ and circulation.</li><li>Failure criteria, next reassessment and who is responding.</li><li>Transport gas, power, monitoring, backup and receiving team.</li></ol>${refs(['rch-oxygen','aha-als'])}</div><div class="card"><h2>Supervised BMV observation checklist</h2><ul><li>Recognizes inadequate breathing and calls for help.</li><li>Prepares equipment, position, airway and mask seal.</li><li>Delivers breaths with visible chest rise at the appropriate rate/context.</li><li>Reassesses heart rate, chest movement and response.</li><li>Corrects ineffective seal/airway; uses two-person support when available.</li><li>Avoids excessive ventilation and communicates clearly.</li></ul><p>A trained assessor must observe the performance. This is a learning aid, not a validated competency instrument.</p>${refs(['aha-bls','aha-als'])}</div><div class="card"><h2>Learn without a connection</h2><p>The single-file edition includes lessons, visuals and assessments. External references need internet. Progress belongs to the browser/file context and does not automatically sync with this website.</p><a class="btn primary" href="offline.html" download="OxyVent-offline.html">Download offline course</a></div><button class="btn secondary" id="printRecord">Print learning prompts</button>`;}
function about(){return heading('EDITION '+C.version,'A course for clinical learning','Recognition, interpretation, reassessment and escalation in pediatric respiratory care.')+`<section class="card"><h2>Scope</h2><p>Online fictional cases and knowledge questions do not assess independent BMV, NIV setup, intubation or bedside performance. Newborn resuscitation and drug prescribing are outside scope.</p><h2>Learning rules</h2><p>Ten questions per unit, two clinical forms, 90% with no critical errors. Forms alternate; further attempts repeat them. Latest complete performance determines current mastery. First and best results remain visible. Explain-back checks describe study completion separately.</p><h2>Clinical review</h2><p>Source-specific checking dates and inspected scope are recorded in the Evidence library; core AHA/AAP and FDA links were rechecked on 16 September 2026. This educational revision awaits independent pediatric clinician review and learner-pilot review. Local targets, devices and responsibilities require local approval before operational use.</p><h2>Privacy</h2><p>No account or analytics. Progress is local; do not enter patient-identifying details. Download your record before changing browsers or clearing storage.</p><h2>Design lineage</h2><p>Uses the user’s Module Builder patterns: source-linked data, role application, confidence-rated decisions, honest learning records and generated offline delivery.</p></section>`;}
function visual(kind){if(!kind)return '';if(kind==='waveform')return `<figure class="visual-card"><figcaption><b>Read the end of expiration</b><span>Schematic flow–time curves, not real patient data</span></figcaption><div class="wave-grid">${[['Complete expiration','M15 75 L15 25 L80 25 L80 75 Q100 140 180 75 L225 75','Flow returns to zero before the next breath.'],['Incomplete expiration','M15 75 L15 25 L80 25 L80 75 Q110 140 200 95 L200 25 L225 25','The next breath starts while expiratory flow persists: consider air trapping.']].map(([t,d,a])=>`<div><h3>${t}</h3><svg viewBox="0 0 240 160" role="img" aria-label="${a}"><path d="M5 75H235" stroke="#92aeb7" stroke-dasharray="4"/><path d="${d}" fill="none" stroke="#128477" stroke-width="4"/><text x="175" y="65" fill="currentColor" font-size="12">zero flow</text></svg><p>${a}</p></div>`).join('')}</div></figure>`;
 const items=kind==='bmv'?[['Prepare','Call for help; position the airway and check bag, mask and oxygen.'],['Seal','Choose the mask and use a two-person seal when available.'],['Ventilate','Give breaths producing visible chest rise; avoid excessive pressure and rate.'],['Reassess','Check chest movement, heart rate and response. Correct ineffective ventilation.']]:kind==='devices'?[['Nasal prongs','Oxygen; variable FiO₂'],['Reservoir mask','Higher oxygen concentration; does not ventilate'],['HFNC / NIV','Selected support; monitor and plan failure'],['Bag-mask','Assisted breaths; assess chest rise']]:kind==='oxygenation'?[['Lungs','Load oxygen: saturation'],['Blood','Haemoglobin: carrying capacity'],['Circulation','Cardiac output: tissue delivery']]:[['Assess','What is failing?'],['Intervene','What should change?'],['Reassess','Continue, adjust or escalate?']];return `<figure class="visual-card"><figcaption><b>${kind==='bmv'?'Effective bag-mask ventilation: an observed skill':kind==='devices'?'Choose the job before the device':kind==='oxygenation'?'Three links in oxygen delivery':'Every intervention needs a response check'}</b><span>Conceptual learning diagram</span></figcaption><div class="flow-diagram">${items.map(([t,p],i)=>`<div><span class="map-number">0${i+1}</span><h3>${t}</h3><p>${p}</p></div>`).join('')}</div></figure>`;}
function closeDrawer(restore=true){drawerOpen=false;syncDrawer();if(restore)document.getElementById('menuBtn')?.focus();}
function syncDrawer(){const side=document.getElementById('sidebar');if(!side)return;const mobile=matchMedia('(max-width: 1050px)').matches;side.classList.toggle('open',mobile&&drawerOpen);side.inert=mobile&&!drawerOpen;side.setAttribute('aria-hidden',String(mobile&&!drawerOpen));document.getElementById('menuBtn').setAttribute('aria-expanded',String(mobile&&drawerOpen));document.getElementById('scrim').hidden=!(mobile&&drawerOpen);document.querySelector('main').inert=mobile&&drawerOpen;document.querySelector('.topbar').inert=mobile&&drawerOpen;document.body.classList.toggle('drawer-open',mobile&&drawerOpen);}
function bind(){
 document.getElementById('learnerName')?.addEventListener('input',e=>{state.learnerName=e.target.value.slice(0,80);save();const label=document.getElementById('certificateName');if(label)label.textContent=state.learnerName.trim()||'Your name';});
 document.getElementById('certificatePrint')?.addEventListener('click',()=>{if(!K.certificateEligible(state,C)||!state.learnerName.trim()){document.getElementById('certificateError').textContent='Enter your name before saving your certificate.';return;}window.print();});
 document.getElementById('certificateDownload')?.addEventListener('click',()=>{if(!K.certificateEligible(state,C)||!state.learnerName.trim()){document.getElementById('certificateError').textContent='Enter your name before downloading your certificate.';return;}download('OxyVent-certificate.svg',certificateSvg(),'image/svg+xml');});
 document.getElementById('sourceUnit')?.addEventListener('change',e=>{const id=e.target.value;document.querySelectorAll('[data-source-units]').forEach(card=>{card.hidden=!!id&&!card.dataset.sourceUnits.split(' ').includes(id);});});

 for(const field of ['role','depth'])document.getElementById(field).onchange=e=>{state[field]=e.target.value;save();render(false);document.getElementById(field).focus();};
 document.getElementById('menuBtn').onclick=()=>{drawerOpen=true;syncDrawer();document.getElementById('closeMenu').focus();};document.getElementById('closeMenu').onclick=()=>closeDrawer();document.getElementById('scrim').onclick=()=>closeDrawer();
 document.querySelectorAll('[data-check]').forEach(e=>e.onchange=()=>{state.checks[e.dataset.check]=e.checked;save();const u=byId(route().split('/')[1]);const p=document.getElementById('studyProgress');if(p&&u)p.textContent=studyProgress(u);});
 document.querySelectorAll('[data-note]').forEach(e=>e.oninput=()=>{state.notes[e.dataset.note]=e.value;save();document.getElementById('note-status').textContent=storageOK?'Learning note saved in this browser.':'Session only: export before leaving.';});
 document.querySelector('[data-depth-all]')?.addEventListener('click',()=>{state.depth='nice';save();render();});
 document.querySelectorAll('[data-start]').forEach(e=>e.onclick=()=>{const u=byId(e.dataset.start);if(K.start(state,C,u)){save();go('assessment/'+u.id);}});
 document.querySelectorAll('[data-q] input[type=radio]').forEach(e=>e.onchange=()=>{const id=e.closest('[data-q]').dataset.q;(pending[id]||={}).choice=e.value;});
 document.querySelectorAll('[data-confidence]').forEach(e=>e.onchange=()=>{(pending[e.dataset.confidence]||={}).confidence=Number(e.value);});
 document.querySelectorAll('[data-submit]').forEach(e=>e.onclick=()=>{const id=e.dataset.submit,p=pending[id],context=e.dataset.context;if(!p?.choice||![1,2,3].includes(p.confidence)){document.getElementById('error-'+id).textContent='Choose an answer and rate confidence before submitting.';return;}if(context.startsWith('unit:')){if(!K.submit(state,C,byId(context.split(':')[1]),p.choice,p.confidence))return;}else{const pool=context==='baseline'?'baseline':'cases',q=[...C.baseline,...C.cases.flatMap(c=>c.steps)].find(q=>q.id===id);if(!q||state[pool][id])return;state[pool][id]={choice:p.choice,confidence:p.confidence,time:new Date().toISOString()};}save();render();document.querySelector('.feedback')?.scrollIntoView({block:'center'});});
 document.querySelectorAll('[data-next]').forEach(e=>e.onclick=()=>{const u=byId(e.dataset.next),step=K.advance(state,C,u);save();if(step==='finished')go('result/'+u.id);else render();});
 document.querySelectorAll('[data-case-retry]').forEach(e=>e.onclick=()=>{delete state.cases[e.dataset.caseRetry];delete pending[e.dataset.caseRetry];save();render();});
 document.querySelectorAll('[data-case-next]').forEach(e=>e.onclick=()=>{const q=C.cases.flatMap(c=>c.steps).find(q=>q.id===e.dataset.caseNext),r=state.cases[q.id];if(r?.choice===q.answer){r.acknowledged=true;save();render();}});
 document.getElementById('exportRecord')?.addEventListener('click',()=>download('OxyVent-learning-record.json',JSON.stringify({course:C.title,version:C.version,exported:new Date().toISOString(),record:state},null,2),'application/json'));
 document.getElementById('printRecord')?.addEventListener('click',()=>window.print());
 document.getElementById('resetRecord')?.addEventListener('click',()=>{if(confirm('Reset this edition’s learning record? Download it first to keep a copy.')){state=K.fresh();pending={};save();go('home');}});
}
function download(name,text,type){const a=document.createElement('a'),url=URL.createObjectURL(new Blob([text],{type}));a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);}
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&drawerOpen)closeDrawer();if(e.key==='Tab'&&drawerOpen){const items=[...document.querySelectorAll('#sidebar a,#sidebar button,#sidebar select')].filter(e=>!e.disabled),first=items[0],last=items.at(-1);if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus();}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus();}}});
window.addEventListener('hashchange',()=>{if(route()==='main'){document.getElementById('main').focus();return;}closeDrawer(false);render();});
matchMedia('(max-width: 1050px)').addEventListener('change',()=>{drawerOpen=false;syncDrawer();});
document.querySelector('.skip-link').onclick=e=>{e.preventDefault();const main=document.getElementById('main');main.focus();main.scrollIntoView({block:'start'});};
render(false);
function studyProgress(u){const core=u.sections.filter(s=>s.depth==='must');return `${core.filter(s=>state.checks[s.id]).length}/${core.length} core sections explained`;}
function lessonTools(u){return `<div class="lesson-tools"><div><b>YOUR STUDY CHECKPOINT</b><span id="studyProgress" role="status">${studyProgress(u)}</span></div><div class="actions">${button('Practice decisions',`assessment/${u.id}`,'secondary')}${button('Unit references',`sources/${u.id}`,'secondary')}</div></div>`;}
function certificateDetails(){const dates=C.units.map(u=>K.history(state,u).at(-1)?.finished||'').filter(Boolean).sort();return {date:dates.at(-1)?.slice(0,10)||'',ready:K.certificateEligible(state,C)};}
function certificatePage(){const {ready,date}=certificateDetails(),n=C.units.filter(u=>K.mastered(state,u)).length;return heading('YOUR ACHIEVEMENT','Completion certificate',ready?'You completed the entire OxyVent assessment pathway. Personalise and save your certificate.':'Your certificate has a home here from day one. Complete all twelve units to unlock it.')+`<div class="certificate-controls card"><div class="completion-milestones"><span>${n}/12 units mastered</span><span>90% in each unit</span><span>No safety-critical errors</span></div>${ready?`<label for="learnerName">Name to appear on your certificate</label><input id="learnerName" maxlength="80" autocomplete="name" value="${esc(state.learnerName||'')}" placeholder="Enter your full name"><p class="small">Stored on this device only. Use Print / Save PDF and choose “Save as PDF” in your browser.</p><div class="actions"><button class="btn primary" id="certificatePrint">Print / Save PDF</button><button class="btn secondary" id="certificateDownload">Download certificate (SVG)</button></div><p id="certificateError" role="alert"></p>`:`<p>${C.units.length-n} unit(s) remain. The preview below shows what you will receive.</p>${button('Continue your learning',`learn/${nextUnit()?.id||'start'}`)}`} ${button('View assessment record','record','text')}</div><section class="award ${ready?'earned':'preview'}" aria-label="${ready?'Completion certificate':'Certificate preview, not issued'}"><div class="award-brand">VIKKYPAEDIA <span>CLINICAL LEARNING</span></div><div class="award-emblem" aria-hidden="true">O₂</div><p class="eyebrow">${ready?'ACHIEVEMENT IN SELF-DIRECTED LEARNING':'PREVIEW · COMPLETE THE COURSE TO UNLOCK'}</p><h2>Certificate of Completion</h2><p>This recognises</p><div class="award-name" id="certificateName">${ready?esc(state.learnerName?.trim()||'Your name'):'Your name'}</div><p>for completing</p><h3>OxyVent</h3><p class="award-subtitle">Pediatric Oxygenation & Ventilation</p><p>12 units · Clinical reasoning · Respiratory support · Patient safety</p><div class="award-meta"><span>Learning standard<br><b>≥90% per unit · no critical errors</b></span><span>Completion date<br><b>${ready?esc(date):'Available after completion'}</b></span></div><p class="award-foot">Vikkypaedia · Edition ${C.version}<br>Self-directed educational completion, based on locally stored assessments.<br>Not an accredited qualification or verification of clinical procedural competence.</p></section>`;}
function certificateSvg(){const d=certificateDetails();return `<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="990" viewBox="0 0 1400 990"><rect width="1400" height="990" fill="#fffcf3"/><rect x="30" y="30" width="1340" height="930" rx="10" fill="none" stroke="#b79b58" stroke-width="4"/><rect x="45" y="45" width="1310" height="900" fill="none" stroke="#b79b58"/><path d="M45 45H1355V180H45Z" fill="#092c39"/><g text-anchor="middle" font-family="Georgia,serif" fill="#092c39"><text x="700" y="105" fill="#61e4cc" font-family="Arial,sans-serif" font-size="24" letter-spacing="6">VIKKYPAEDIA · CLINICAL LEARNING</text><text x="700" y="152" fill="white" font-size="30">OxyVent</text><text x="700" y="282" font-size="55">Certificate of Completion</text><text x="700" y="347" font-size="22">This recognises</text><text x="700" y="440" font-size="${(state.learnerName||'').length>60?22:(state.learnerName||'').length>40?30:48}">${esc(state.learnerName.trim())}</text><path d="M230 465H1170" stroke="#b79b58"/><text x="700" y="530" font-size="23">for completing the self-directed course</text><text x="700" y="590" font-size="36">Pediatric Oxygenation &amp; Ventilation</text><text x="700" y="652" font-family="Arial,sans-serif" font-size="21">12 units · At least 90% per unit · No safety-critical errors</text><text x="700" y="730" font-size="23">Completed ${esc(d.date)} · Edition ${esc(C.version)}</text><text x="700" y="850" font-family="Arial,sans-serif" font-size="17">Self-directed educational completion based on locally stored assessments.</text><text x="700" y="883" font-family="Arial,sans-serif" font-size="17">Not an accredited qualification or verification of clinical procedural competence.</text></g></svg>`;}
function sourcesPage(selected=""){return heading('THE EVIDENCE BEHIND YOUR DECISIONS','References & further reading','Follow a recommendation from the lesson to its source. Publication dates, checking dates and scope are shown separately.')+`<div class="evidence-summary"><div><b>2025</b><span>AHA / AAP resuscitation guidance</span></div><div><b>2023</b><span>PALICC-2 PARDS consensus</span></div><div><b>By unit</b><span>Source-to-teaching mapping</span></div></div><div class="card"><label for="sourceUnit">Find references for a unit</label><select id="sourceUnit"><option value="">All references</option>${C.units.map((u,i)=>`<option value="${u.id}" ${selected===u.id?'selected':''}>${i+1}. ${esc(u.title)}</option>`).join('')}</select><p class="small">A newer access date does not make an older guideline a new edition. RCH protocols are institution-specific; WHO is background reading. Independent clinical review remains pending.</p><button class="btn secondary" id="printRecord">Print reference list</button></div><div class="source-grid">${C.sources.map((s,i)=>{const units=C.units.filter(u=>u.sections.some(x=>x.sourceIds.includes(s.id))||u.questions.some(p=>p.variants.some(q=>q.sourceIds.includes(s.id))));return `<article class="card reference-card" ${selected&&!units.some(u=>u.id===selected)?'hidden':''} data-source-units="${units.map(u=>u.id).join(' ')}"><div class="reference-number">${String(i+1).padStart(2,'0')}</div><p class="eyebrow">${esc(s.organization)}</p><h2><a href="${esc(s.url)}" ${s.url.startsWith('http')?'target="_blank" rel="noopener"':''}>${esc(s.title)} ↗</a></h2><p class="reference-version">${esc(s.version)}</p><p><b>Used for:</b> ${esc(s.scope)}</p><details><summary>Applicability & checking notes</summary><p>${esc(s.caveat)}</p><p>Checked ${esc(s.checkedOn)}. ${esc(s.access)}</p></details><div class="source-units">${units.map(u=>button(`Unit ${C.units.indexOf(u)+1}`,`learn/${u.id}`,'text')).join('')||'<span class="small">Further reading / course methodology</span>'}</div></article>`;}).join('')}</div>`;}

function reviewPlan(){const items=C.units.flatMap(u=>{const latest=K.latest(state,u);return latest?latest.missed.map(q=>({u,q})):[];});if(!items.length)return '';const grouped=new Map();for(const item of items){const key=item.u.id+'/'+item.q.sectionId;const old=grouped.get(key);if(!old||item.q.critical)grouped.set(key,item);}const list=[...grouped.values()].sort((a,b)=>Number(b.q.critical)-Number(a.q.critical));return '<section class="card review-plan"><p class="eyebrow">YOUR NEXT STUDY SESSION</p><h2>Review the decisions that need attention</h2><p>Based on your latest completed attempts. Safety-critical concepts come first; a new completed attempt updates this list.</p><ul>'+list.map(({u,q})=>'<li><span class="tag">'+(q.critical?'Safety first':'Revisit')+'</span><div><b>'+esc(u.title)+'</b><p>'+esc(q.why)+'</p>'+button('Open the teaching','learn/'+u.id+'/'+q.sectionId,'text')+'</div></li>').join('')+'</ul></section>'; }
</script></body></html>
