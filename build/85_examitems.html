<script>
/* ============================================================================
   Fresh integrative items for the final assessment only.
   These do NOT appear as unit checkpoints. Each crosses two or more units.
   C(...) marks a safety-critical item: with MC.safetyGate on, an attempt that
   misses any safety-critical item does not count towards the applied criterion.
   ========================================================================= */
window.EXAM_ITEMS = (function(){
function I(id, unit, stem, opts, rationale, critical){
  return { id:id, unit:unit, source:"fresh", stem:stem, critical:!!critical,
           opts: opts.map(function(o){ return { html:o[0], correct:!!o[1] }; }),
           rationale: rationale };
}
function C(id, unit, stem, opts, rationale){ return I(id, unit, stem, opts, rationale, true); }
return [

I("X01", 3,
 "A 5-year-old after a head injury is on a face mask at 6 L/min. SpO₂ is 98%. He has become harder to rouse and his breathing is slow and shallow. What is the key concern?",
 [["Oxygenation is adequate, so breathing is not a problem.", 0],
  ["Ventilation may be failing and the oxygen is masking it on the monitor.", 1],
  ["The oximeter is reading falsely high because of the mask.", 0],
  ["He needs a higher oxygen flow to maintain 98%.", 0]],
 "<h6>Why</h6><p>Oxygen can keep SpO₂ normal while CO₂ rises. Falling consciousness with slow, shallow breathing points to <b>ventilatory failure</b>. Assess airway and breathing, check CO₂ (gas or EtCO₂), and support ventilation. More oxygen does not treat it. (Units 2, 3)</p>"),

I("X02", 4,
 "A 3-year-old has cold hands and a flickering, poorly shaped pleth wave. The oximeter shows 88% and then 97% within a minute. What should you do?",
 [["Record 97%, as it is the higher and more recent value.", 0],
  ["Record the average of 92%.", 0],
  ["Treat the reading as unreliable, warm the site or change probe position, and assess the child clinically while you do so.", 1],
  ["Stop oximetry and rely on skin colour.", 0]],
 "<h6>Why</h6><p>A number is only as good as its signal. Poor perfusion and a poor waveform make readings unreliable. Improve the signal and assess the child; a cold periphery may also be a sign of shock. (Units 2, 4)</p>"),

C("X03", 5,
 "A 2-year-old with pneumonia on nasal prongs at 2 L/min reaches the SpO₂ target, but his respiratory rate climbs from 50 to 64/min and he starts grunting. What does this mean?",
 [["The treatment is working, since the target is reached.", 0],
  ["He is deteriorating despite the target; call for review and plan escalation of support.", 1],
  ["The prongs should be changed to a face mask at the same flow.", 0],
  ["Reduce the flow to prevent oxygen toxicity.", 0]],
 "<h6>Why</h6><p>A target reached is not the same as a child improving. Rising rate and grunting mean increasing work of breathing: escalate (review, CPAP or high-flow, and prepare for failure). (Units 2, 5, 9)</p>"),

I("X04", 6,
 "A district hospital's oxygen concentrator alarm sounds during a power cut. Three children are on oxygen from it. What should be ready before this ever happens?",
 [["A written plan with a full backup cylinder, regulator and a named person responsible.", 1],
  ["A spare concentrator in storage.", 0],
  ["An instruction to stop oxygen during power cuts.", 0],
  ["A generator that is tested once a year.", 0]],
 "<h6>Why</h6><p>Oxygen is a system: source, backup, power, maintenance and people. A spare concentrator needs power too. Every ward using concentrators needs cylinders as backup and a named person who knows the plan. (Units 5, 6)</p>"),

C("X05", 7,
 "A 1-year-old is apnoeic with a pulse of 110/min. You are giving bag-mask breaths but the chest is not rising. What should you do next?",
 [["Squeeze the bag harder and faster.", 0],
  ["Reposition the head and jaw, check the mask seal, and use two-person technique; suction if needed.", 1],
  ["Start chest compressions immediately.", 0],
  ["Change to a larger bag.", 0]],
 "<h6>Why</h6><p>No chest rise usually means an open-airway or seal problem. Correct the head position, lift the jaw, improve the seal (two people), clear the airway, and consider an airway adjunct. Compressions are for no pulse or a heart rate below the local threshold with poor perfusion despite effective ventilation. (Units 7, 11)</p>"),

I("X06", 7,
 "What is the recommended breath rate when giving breaths to a child who has a pulse but is not breathing adequately (AHA/AAP 2025)?",
 [["One breath every 6 seconds (10/min).", 0],
  ["One breath every 2&ndash;3 seconds (20&ndash;30/min).", 1],
  ["40&ndash;60 breaths/min, as for newborns.", 0],
  ["As fast as possible until the chest rises.", 0]],
 "<h6>Why</h6><p>Current guidance for an infant or child with a pulse is one breath every 2&ndash;3 seconds. The 40&ndash;60/min rate belongs to the newborn delivery-room pathway. Over-ventilation causes gastric inflation and air trapping. (Unit 7)</p>"),

I("X07", 8,
 "An 8-month-old with bronchiolitis on high-flow for 90 minutes has a falling heart rate and respiratory rate and a stable SpO₂ on FiO₂ 0.4. What does this trajectory suggest?",
 [["Success: continue and reassess regularly.", 1],
  ["Failure: prepare for intubation.", 0],
  ["The flow should be doubled.", 0],
  ["High-flow is not indicated and should be stopped.", 0]],
 "<h6>Why</h6><p>Falling heart and respiratory rates in the first 1&ndash;2 hours with stable oxygenation is the pattern of <b>success</b>. Keep watching; failure signs are rising rates, rising FiO₂ need, apnoea or exhaustion. (Units 8, 12)</p>"),

C("X08", 9,
 "A 3-year-old with severe pneumonia is started on bubble CPAP in a district hospital. Which condition matters most for this to be safe?",
 [["A chest X-ray before starting.", 0],
  ["Close, trained monitoring with a clear failure plan and someone able to act on it.", 1],
  ["A blood gas every hour.", 0],
  ["Starting with the highest available pressure.", 0]],
 "<h6>Why</h6><p>Bubble CPAP reduced treatment failure and deaths in Bangladesh where physicians monitored closely; a Malawi trial without that supervision found possible harm. The device is only as safe as the monitoring and response around it. (Units 9, 13)</p>"),

I("X09", 10,
 "Which child is the least suitable for a trial of non-invasive ventilation?",
 [["A 12-year-old with neuromuscular weakness and a rising CO₂, alert and cooperative.", 0],
  ["A 6-year-old with pneumonia, rising work of breathing and an intact airway.", 0],
  ["A 4-year-old who is drowsy, vomiting and cannot protect his airway.", 1],
  ["A 10-year-old after extubation with mild distress.", 0]],
 "<h6>Why</h6><p>Non-invasive ventilation needs an airway the child can protect. Reduced consciousness with vomiting risks aspiration: this child needs a definitive airway plan. (Units 10, 11)</p>"),

C("X10", 11,
 "A 2-year-old with septic shock and pneumonia needs intubation. What should happen before induction?",
 [["Give the induction drugs quickly to get the tube in.", 0],
  ["Pre-oxygenate, give fluid or start a vasoactive infusion as needed, have push-dose adrenaline ready, and assign roles.", 1],
  ["Wait until the SpO₂ is 100% on room air.", 0],
  ["Stop oxygen to avoid delaying the procedure.", 0]],
 "<h6>Why</h6><p>Induction and positive-pressure ventilation reduce venous return and can cause arrest in a shocked child. Resuscitate before you intubate: oxygen, circulation support, drugs ready and a team briefing. (Units 11, 13)</p>"),

I("X11", 12,
 "A 3-month-old with bronchiolitis is feeding poorly and has SpO₂ 91% in room air. According to the 2025 Australasian guideline, what is right?",
 [["Start oxygen and give nebulised salbutamol.", 0],
  ["Do not start oxygen for SpO₂ 91% at this age; support feeding, and use nasogastric feeds if oral intake is inadequate.", 1],
  ["Start high-flow at 2 L/kg/min.", 0],
  ["Give oral prednisolone.", 0]],
 "<h6>Why</h6><p>From 6 weeks of age, the 2025 guideline starts oxygen when SpO₂ is persistently below 90% (92% if under 6 weeks or with other conditions). Bronchodilators and steroids are strongly recommended against. Nasogastric hydration is preferred first. (Units 5, 12)</p>"),

I("X12", 13,
 "A 2-year-old with fast breathing and chest indrawing has SpO₂ 95% and is feeding well. Under WHO 2024 guidance, which antibiotic plan fits best?",
 [["Oral amoxicillin, with follow-up.", 1],
  ["IV ceftriaxone for 10 days.", 0],
  ["No antibiotic, as the saturation is normal.", 0],
  ["Oral azithromycin alone.", 0]],
 "<h6>Why</h6><p>Chest-indrawing pneumonia without danger signs or hypoxaemia can be treated with oral amoxicillin under WHO guidance, with follow-up. Hypoxaemia or danger signs would change this. (Units 4, 13)</p>"),

C("X13", 14,
 "A 7-year-old with acute asthma has a quiet chest, cannot speak, is drowsy and has SpO₂ 89% on a mask. What does this mean?",
 [["The wheeze has resolved, so she is improving.", 0],
  ["Life-threatening asthma: give oxygen, continuous bronchodilator, systemic steroid, IV magnesium, and call for senior help.", 1],
  ["Moderate asthma: give one salbutamol puff and review in an hour.", 0],
  ["She needs a chest X-ray before further treatment.", 0]],
 "<h6>Why</h6><p>A silent chest means too little air is moving to wheeze. With drowsiness and hypoxaemia this is life-threatening asthma: treat immediately and escalate. (Units 2, 14)</p>"),

I("X14", 14,
 "What is the usual dose of IV magnesium sulphate for severe acute asthma in a child?",
 [["4&ndash;5 mg/kg, maximum 200 mg.", 0],
  ["40&ndash;50 mg/kg over 20 minutes, maximum 2 g.", 1],
  ["400&ndash;500 mg/kg, maximum 20 g.", 0],
  ["0.4&ndash;0.5 mg/kg, maximum 20 mg.", 0]],
 "<h6>Why</h6><p>The usual dose is 40&ndash;50 mg/kg (maximum 2 g) given over about 20 minutes, with blood pressure monitoring. Check your local protocol. (Unit 14)</p>"),

C("X15", 15,
 "A 4-year-old with sudden drooling, fever, tripod posture and soft stridor is sitting up with his mother. What should you avoid?",
 [["Calling the most experienced airway team.", 0],
  ["Keeping him calm with his mother.", 0],
  ["Laying him flat to examine his throat with a tongue depressor.", 1],
  ["Giving oxygen in the way he tolerates best.", 0]],
 "<h6>Why</h6><p>This picture suggests epiglottitis or another severe upper-airway obstruction. Upsetting the child, lying him flat or examining the throat can cause complete obstruction. Keep him calm and upright and bring the airway team to him. (Units 11, 15)</p>"),

I("X16", 15,
 "A 2-year-old with croup has stridor at rest and moderate recession. What is the correct first treatment?",
 [["Nebulised salbutamol.", 0],
  ["Oral or IV antibiotics.", 0],
  ["Dexamethasone and nebulised adrenaline, with observation after adrenaline.", 1],
  ["Chest physiotherapy.", 0]],
 "<h6>Why</h6><p>Stridor at rest with recession is moderate-to-severe croup: nebulised adrenaline for rapid relief and a corticosteroid (dexamethasone) for sustained effect. Observe after adrenaline, as the effect wears off after about 2 hours. (Unit 15)</p>"),

I("X17", 16,
 "A child with pneumonia is ventilated with worsening oxygenation. Which finding supports a diagnosis of paediatric ARDS under PALICC-2?",
 [["New infiltrates with hypoxaemia within 7 days of a known risk factor, not fully explained by heart failure or fluid overload.", 1],
  ["Any child with pneumonia who needs oxygen.", 0],
  ["Wheeze with a prolonged expiratory phase.", 0],
  ["Hypoxaemia only in a child with cyanotic heart disease at baseline.", 0]],
 "<h6>Why</h6><p>PALICC-2 defines paediatric ARDS by timing (within 7 days of a known insult), new infiltrates, and hypoxaemia not fully explained by cardiac failure or fluid overload, graded by oxygenation index or saturation index. (Units 13, 16)</p>"),

I("X18", 17,
 "A ventilated 5-year-old has a set tidal volume of 120 mL but an exhaled tidal volume of 70 mL. What is the most likely explanation?",
 [["A leak around the tube or in the circuit.", 1],
  ["Improved lung compliance.", 0],
  ["Bronchospasm.", 0],
  ["A normal difference in all ventilators.", 0]],
 "<h6>Why</h6><p>A large gap between set and exhaled volume means gas is escaping (tube leak, displacement, circuit leak) or a measurement problem. Check the tube, cuff and circuit, and the child. (Units 17, 18)</p>"),

C("X19", 17,
 "A ventilated child with severe asthma has an expiratory flow curve that does not return to zero before the next breath, and falling blood pressure. What is the most useful ventilator change?",
 [["Increase the rate to clear CO₂.", 0],
  ["Reduce the rate to allow longer expiration.", 1],
  ["Increase the tidal volume.", 0],
  ["Increase the inspiratory time.", 0]],
 "<h6>Why</h6><p>The flow curve shows incomplete exhalation (air trapping). A slower rate lengthens expiration, lets the trapped air out and improves venous return. A higher rate or longer inspiration makes trapping worse. (Units 14, 17, 18)</p>"),

C("X20", 18,
 "A ventilated child's high-pressure alarm sounds. SpO₂ is falling. A suction catheter will not pass beyond the end of the tube. What is the most likely cause and action?",
 [["Pneumothorax: needle decompression.", 0],
  ["Blocked or kinked tube: call for help, bag-mask ventilate and prepare to replace the tube.", 1],
  ["Ventilator failure: change the circuit.", 0],
  ["Bronchospasm: give salbutamol through the tube.", 0]],
 "<h6>Why</h6><p>A catheter that cannot pass points to <b>obstruction</b> of the tube. Do not force it and do not bag harder through a blocked tube. Support with bag-mask ventilation and replace the airway. (Units 7, 18)</p>"),

I("X21", 18,
 "In the DOPES check for a ventilated child, what does the S stand for, and when is it most likely?",
 [["Secretions, in children with pneumonia.", 0],
  ["Stacked breaths, in obstructive disease with fast ventilation.", 1],
  ["Sedation, after a missed dose.", 0],
  ["Shock, after a fluid bolus.", 0]],
 "<h6>Why</h6><p>S is for stacked breaths (air trapping): the next breath begins before the last one is out, usually in asthma or bronchiolitis with rapid bagging. Disconnect briefly and ventilate more slowly. (Units 14, 18)</p>"),

C("X22", 19,
 "A child needs 6 L/min of oxygen for a 45-minute transfer. You have one 680 L cylinder showing half full. Is it enough?",
 [["Yes: 340 L lasts about 57 minutes, which is more than 45.", 0],
  ["No: 340 L lasts about 57 minutes, less than the 90 minutes you should plan for; take another cylinder.", 1],
  ["Yes, if the flow is reduced to 3 L/min for the journey.", 0],
  ["Not possible to calculate.", 0]],
 "<h6>Why</h6><p>Half of 680 L is 340 L; at 6 L/min that is about 57 minutes. Plan for at least twice the journey time (90 minutes = 540 L). Never reduce the support a child needs to fit the supply. (Units 6, 19)</p>"),

I("X23", 19,
 "A child was extubated 4 hours ago after 6 days of ventilation. She now has inspiratory stridor at rest and increasing recession. What is the best immediate plan?",
 [["Reassure the family; stridor always settles.", 0],
  ["Give nebulised adrenaline, consider a corticosteroid, and alert the team who can reintubate if she does not improve.", 1],
  ["Start oral antibiotics.", 0],
  ["Give a large fluid bolus.", 0]],
 "<h6>Why</h6><p>Post-extubation stridor reflects upper-airway oedema. Nebulised adrenaline and a corticosteroid can help; the team who can reintubate must be ready, as some children will need it. (Units 15, 19)</p>"),

I("X24", 19,
 "Which child is at highest risk of extubation failure?",
 [["A 4-year-old ventilated for 1 day after elective surgery.", 0],
  ["A 3-year-old with spinal muscular atrophy ventilated for 12 days, with a weak cough.", 1],
  ["A 10-year-old ventilated for 2 days after a seizure, now fully awake.", 0],
  ["A 6-year-old ventilated for 1 day for a drug overdose, now alert.", 0]],
 "<h6>Why</h6><p>Prolonged ventilation, neuromuscular weakness and a weak cough all raise the risk of failure. Plan post-extubation support (high-flow or non-invasive ventilation) and airway-clearance help for such children. (Units 10, 19)</p>"),

I("X25", 20,
 "In an evolving case, which statement best describes a safe support plan?",
 [["Start the most advanced support available, in case the child gets worse.", 0],
  ["Name the threat, choose the support, set a target and reassessment time, and state what will count as failure.", 1],
  ["Choose the support the child's family prefers.", 0],
  ["Continue any support for at least 6 hours before judging it.", 0]],
 "<h6>Why</h6><p>Every support is a testable plan: what threat it treats, what target it aims for, when you will look again, and what will make you escalate. (Units 1, 20)</p>"),

I("X26", 4,
 "A child with darker skin has SpO₂ 93% on the oximeter, but is increasingly breathless and grunting. How should the reading be interpreted?",
 [["As reassuring, since it is above 92%.", 0],
  ["With caution: oximeters can overestimate saturation in darker skin, so act on the clinical signs and consider a blood gas.", 1],
  ["By subtracting 4% from the reading as a correction.", 0],
  ["By switching to a different finger until it reads 100%.", 0]],
 "<h6>Why</h6><p>Oximeters can overestimate saturation in people with darker skin, which can hide hypoxaemia. There is no validated correction factor. Put more weight on the examination and, if available, arterial saturation. (Units 2, 4)</p>"),

I("X27", 13,
 "In a district hospital without pulse oximetry, which signs suggest a child with pneumonia is hypoxaemic and needs oxygen?",
 [["Cough for more than a week.", 0],
  ["Central cyanosis, inability to drink, grunting, or severe chest indrawing.", 1],
  ["A temperature above 39&nbsp;°C.", 0],
  ["A runny nose.", 0]],
 "<h6>Why</h6><p>WHO lists clinical signs of hypoxaemia for use when oximetry is not available: central cyanosis, nasal flaring, inability to drink or feed, grunting, severe chest indrawing, and depressed consciousness. Oximetry remains strongly preferred. (Units 5, 13)</p>"),

I("X28", 16,
 "A ventilated child with PARDS has SpO₂ 99% on FiO₂ 0.8. What is the most appropriate next step?",
 [["Keep FiO₂ at 0.8, as the saturation is good.", 0],
  ["Reduce FiO₂ towards the target range (about 92&ndash;97% in mild-to-moderate PARDS).", 1],
  ["Increase FiO₂ to 1.0 for extra safety.", 0],
  ["Increase the tidal volume.", 0]],
 "<h6>Why</h6><p>Oxygen needs a target. PALICC-2 suggests SpO₂ 92&ndash;97% in mild-to-moderate PARDS. Unnecessary high FiO₂ adds harm without benefit. (Units 5, 16, 17)</p>"),

I("X29", 6,
 "A family is taking home a baby with bronchopulmonary dysplasia on oxygen. Which piece of advice is most important?",
 [["Keep oxygen away from open flames, stoves and diyas, and have a backup cylinder for power cuts.", 1],
  ["Increase the flow whenever the baby cries.", 0],
  ["Turn off oxygen during feeds to prevent choking.", 0],
  ["Use petroleum jelly under the prongs to prevent dryness.", 0]],
 "<h6>Why</h6><p>Oxygen makes things burn fiercely, and concentrators stop in power cuts. Fire safety and a backup cylinder are the two essentials; flow changes follow the written plan; use water-based products only. (Units 6, 19)</p>"),

C("X30", 20,
 "A child on CPAP for pneumonia suddenly has two apnoeas and is harder to rouse. The planned review is in 2 hours. What should happen?",
 [["Wait for the planned review, as the SpO₂ is 94%.", 0],
  ["Escalate now: call the airway team and prepare for intubation and ventilation.", 1],
  ["Increase the CPAP pressure and review in 2 hours.", 0],
  ["Give a sedative so that the child tolerates CPAP.", 0]],
 "<h6>Why</h6><p>Apnoea and falling consciousness are failure signs of non-invasive support. Escalate on the trajectory, not on the planned review time. Sedation could cause respiratory arrest. (Units 9, 10, 20)</p>")

];
})();
</script>
