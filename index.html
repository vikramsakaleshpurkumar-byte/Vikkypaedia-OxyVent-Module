<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="A mastery-based course in pediatric oxygenation and ventilation for nurses and medical learners.">
  <title>Vikkypaedia OxyVent Module</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml"><link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="app">
  <header class="topbar">
    <button class="mobile-menu" id="menuBtn" aria-label="Open course navigation">☰</button>
    <div class="brand"><span class="brand-mark">O₂</span><div>Vikkypaedia<small>OxyVent Module</small></div></div>
    <div class="top-progress"><span id="progressText">0 of 12 units</span><div class="progress-track"><div class="progress-fill" id="progressFill"></div></div></div>
  </header>
  <div class="shell">
    <aside class="sidebar" id="sidebar">
      <p class="path-label">Your learning path</p>
      <select class="role-select" id="roleSelect" aria-label="Select learner role">
        <option value="ug">Undergraduate student</option><option value="nurse">Ward / emergency nurse</option><option value="picu">PICU nurse</option><option value="pg">Postgraduate student</option>
      </select>
      <nav class="unit-list" id="unitList" aria-label="Course units"></nav>
      <div class="sidebar-foot"><strong>Mastery standard</strong><br>Score 90% in each unit. Missed concepts open a focused remediation card before your next attempt.</div>
    </aside>
    <main class="main" id="main"></main>
  </div>
</div>
<script src="app.js"></script>
</body>
</html>
